<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Login — CESS</title>
  <link
    rel="stylesheet"
    href="style.css"
  >
  <link
    rel="stylesheet"
    href="responsive.css"
  >
</head>
<body>
<!-- =========================================================
     HEADER
     ========================================================= -->
<header class="site-header">
  <div class="nav-wrapper">
    <a
      href="index.html"
      class="logo-link"
    >
      <img
        src="cess-logo.png"
        alt="CESS logo"
        onerror="this.style.display='none'"
      >
      <span class="logo-text-mark">
        <span class="primary">
          CESS
        </span>
        <span
          class="secondary"
          data-en="Civil Engineering Student Society"
          data-ar="جمعية طلاب الهندسة المدنية"
        >
          Civil Engineering Student Society
        </span>
      </span>
    </a>
    <!-- Mobile Menu -->
    <button
      class="hamburger"
      id="hamburger"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
    <!-- Navigation -->
    <nav
      class="nav-menu"
      id="nav-menu"
    >
      <a
        href="index.html"
        data-en="Home"
        data-ar="الرئيسية"
      >
        Home
      </a>
      <a
        href="about.html"
        data-en="About"
        data-ar="عن الجمعية"
      >
        About
      </a>
      <a
        href="activities.html"
        data-en="Activities"
        data-ar="الأنشطة"
      >
        Activities
      </a>
      <a
        href="contact.html"
        data-en="Contact"
        data-ar="تواصل معنا"
      >
        Contact
      </a>
      <div class="nav-actions">
        <button
          id="lang-toggle"
          aria-label="Switch language"
        >
          <span id="lang-toggle-label">
            AR
          </span>
        </button>
      </div>
    </nav>
  </div>
</header>
<!-- =========================================================
     LOGIN FORM
     ========================================================= -->
<div class="form-card">
  <h1
    class="text-center"
    data-en="Login"
    data-ar="تسجيل الدخول"
  >
    Login
  </h1>
  <form id="login-form">
    <!-- Email -->
    <div class="form-group">
      <label
        for="email"
        data-en="Email"
        data-ar="البريد الإلكتروني"
      >
        Email
      </label>
      <input
        type="email"
        id="email"
        required
        autocomplete="email"
      >
    </div>
    <!-- Password -->
    <div class="form-group">
      <label
        for="password"
        data-en="Password"
        data-ar="كلمة المرور"
      >
        Password
      </label>
      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
      >
    </div>
    <!-- Error / Success -->
    <p
      class="form-error"
      id="login-error"
    ></p>
    <!-- Login Button -->
    <button
      type="submit"
      id="login-submit-btn"
      class="btn btn-primary"
      style="width:100%;"
      data-en="Login"
      data-ar="تسجيل الدخول"
    >
      Login
    </button>
  </form>
  <!-- Forgot Password -->
  <p class="form-footer-link">
    <a
      href="#"
      id="forgot-password-link"
      data-en="Forgot password?"
      data-ar="نسيت كلمة المرور؟"
    >
      Forgot password?
    </a>
  </p>
  <!-- Register -->
  <p class="form-footer-link">
    <span
      data-en="Don't have an account?"
      data-ar="ليس لديك حساب؟"
    >
      Don't have an account?
    </span>
    <a
      href="register.html"
      data-en="Create one"
      data-ar="أنشئ حسابًا"
    >
      Create one
    </a>
  </p>
</div>
<!-- =========================================================
     FIREBASE
     ========================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- =========================================================
     CESS CONFIGURATION
     ========================================================= -->
<script src="firebase-config.js"></script>
<!-- =========================================================
     AUTHENTICATION LOGIC
     ========================================================= -->
<script src="auth.js"></script>
<!-- =========================================================
     MAIN APP LOGIC
     ========================================================= -->
<script src="app.js"></script>
<!-- =========================================================
     LOGIN PAGE LOGIC
     ========================================================= -->
<script>
console.log(
  "CESS LOGIN: login.html loaded"
);
/* =========================================================
   ELEMENTS
   ========================================================= */
const loginForm =
  document.getElementById("login-form");
const loginError =
  document.getElementById("login-error");
const loginButton =
  document.getElementById("login-submit-btn");
const forgotPasswordLink =
  document.getElementById("forgot-password-link");
/* =========================================================
   CHECK PAGE
   ========================================================= */
if (!loginForm) {
  console.error(
    "CESS LOGIN ERROR: #login-form was not found."
  );
}
/* =========================================================
   LOGIN
   ========================================================= */
if (loginForm) {
  loginForm.addEventListener(
    "submit",
    async function (event) {
      event.preventDefault();
      console.log(
        "CESS LOGIN: Login button clicked"
      );
      /* -----------------------------------------------------
         Clear previous message
         ----------------------------------------------------- */
      loginError.textContent = "";
      loginError.classList.remove(
        "visible"
      );
      loginError.style.color =
        "var(--color-danger)";
      /* -----------------------------------------------------
         Read values
         ----------------------------------------------------- */
      const email =
        document
          .getElementById("email")
          .value
          .trim();
      const password =
        document
          .getElementById("password")
          .value;
      console.log(
        "CESS LOGIN: Email entered:",
        email
      );
      /* -----------------------------------------------------
         Validate
         ----------------------------------------------------- */
      if (!email) {
        loginError.textContent =
          getLang() === "ar"
            ? "يرجى إدخال البريد الإلكتروني."
            : "Please enter your email address.";
        loginError.classList.add(
          "visible"
        );
        return;
      }
      if (!password) {
        loginError.textContent =
          getLang() === "ar"
            ? "يرجى إدخال كلمة المرور."
            : "Please enter your password.";
        loginError.classList.add(
          "visible"
        );
        return;
      }
      /* -----------------------------------------------------
         Check Firebase
         ----------------------------------------------------- */
      if (
        typeof firebase === "undefined"
      ) {
        console.error(
          "CESS LOGIN ERROR: Firebase is undefined."
        );
        loginError.textContent =
          "Firebase failed to load. Please check your internet connection.";
        loginError.classList.add(
          "visible"
        );
        return;
      }
      if (
        typeof auth === "undefined"
      ) {
        console.error(
          "CESS LOGIN ERROR: auth is undefined."
        );
        loginError.textContent =
          "Firebase Authentication is not initialized.";
        loginError.classList.add(
          "visible"
        );
        return;
      }
      if (
        typeof loginUser !== "function"
      ) {
        console.error(
          "CESS LOGIN ERROR: loginUser() is not defined."
        );
        loginError.textContent =
          "Login system failed to load. Please refresh the page.";
        loginError.classList.add(
          "visible"
        );
        return;
      }
      /* -----------------------------------------------------
         Disable button
         ----------------------------------------------------- */
      if (loginButton) {
        loginButton.disabled = true;
        loginButton.textContent =
          getLang() === "ar"
            ? "جاري تسجيل الدخول..."
            : "Logging in...";
      }
      /* -----------------------------------------------------
         Firebase Authentication
         ----------------------------------------------------- */
      try {
        console.log(
          "CESS LOGIN: Sending login request to Firebase..."
        );
        await loginUser(
          email,
          password
        );
        console.log(
          "CESS LOGIN: Authentication successful."
        );
        /*
         * loginUser() handles the redirect
         * according to the user's role.
         *
         * admin      → admin.html
         * leadership → leadership.html
         * member     → member.html
         */
      }
      catch (error) {
        console.error(
          "CESS LOGIN ERROR:",
          error
        );
        let message =
          error.message ||
          "Unable to login.";
        /* ---------------------------------------------------
           Firebase error messages
           --------------------------------------------------- */
        switch (error.code) {
          case "auth/invalid-credential":
            message =
              getLang() === "ar"
                ? "البريد الإلكتروني أو كلمة المرور غير صحيحة."
                : "Incorrect email or password.";
            break;
          case "auth/user-not-found":
            message =
              getLang() === "ar"
                ? "لا يوجد حساب بهذا البريد الإلكتروني."
                : "No account found with this email.";
            break;
          case "auth/wrong-password":
            message =
              getLang() === "ar"
                ? "كلمة المرور غير صحيحة."
                : "Incorrect password.";
            break;
          case "auth/invalid-email":
            message =
              getLang() === "ar"
                ? "البريد الإلكتروني غير صحيح."
                : "Invalid email address.";
            break;
          case "auth/too-many-requests":
            message =
              getLang() === "ar"
                ? "تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقًا."
                : "Too many login attempts. Please try again later.";
            break;
          case "auth/network-request-failed":
            message =
              getLang() === "ar"
                ? "حدثت مشكلة في الاتصال بالإنترنت."
                : "Network error. Please check your connection.";
            break;
          case "auth/user-disabled":
            message =
              getLang() === "ar"
                ? "تم تعطيل هذا الحساب."
                : "This account has been disabled.";
            break;
        }
        /* ---------------------------------------------------
           Display error
           --------------------------------------------------- */
        loginError.style.color =
          "var(--color-danger)";
        loginError.textContent =
          message;
        loginError.classList.add(
          "visible"
        );
        /* ---------------------------------------------------
           Enable button again
           --------------------------------------------------- */
        if (loginButton) {
          loginButton.disabled = false;
          loginButton.textContent =
            getLang() === "ar"
              ? "تسجيل الدخول"
              : "Login";
        }
      }
    }
  );
}
/* =========================================================
   FORGOT PASSWORD
   ========================================================= */
if (forgotPasswordLink) {
  forgotPasswordLink.addEventListener(
    "click",
    async function (event) {
      event.preventDefault();
      console.log(
        "CESS LOGIN: Forgot password clicked"
      );
      /* -----------------------------------------------------
         Clear previous message
         ----------------------------------------------------- */
      loginError.textContent = "";
      loginError.classList.remove(
        "visible"
      );
      loginError.style.color =
        "var(--color-danger)";
      /* -----------------------------------------------------
         Get email
         ----------------------------------------------------- */
      const email =
        document
          .getElementById("email")
          .value
          .trim();
      if (!email) {
        loginError.textContent =
          getLang() === "ar"
            ? "يرجى إدخال بريدك الإلكتروني أولاً."
            : "Please enter your email address first.";
        loginError.classList.add(
          "visible"
        );
        return;
      }
      /* -----------------------------------------------------
         Check Firebase
         ----------------------------------------------------- */
      if (
        typeof sendPasswordReset !==
        "function"
      ) {
        loginError.textContent =
          "Password reset system is not loaded.";
        loginError.classList.add(
          "visible"
        );
        return;
      }
      /* -----------------------------------------------------
         Send reset email
         ----------------------------------------------------- */
      try {
        console.log(
          "CESS LOGIN: Sending password reset email..."
        );
        await sendPasswordReset(
          email
        );
        loginError.style.color =
          "var(--color-success)";
        loginError.textContent =
          getLang() === "ar"
            ? "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني."
            : "Password reset email sent.";
        loginError.classList.add(
          "visible"
        );
      }
      catch (error) {
        console.error(
          "CESS PASSWORD RESET ERROR:",
          error
        );
        loginError.style.color =
          "var(--color-danger)";
        loginError.textContent =
          `${error.code || "Error"} — ${
            error.message ||
            "Unable to send password reset email."
          }`;
        loginError.classList.add(
          "visible"
        );
      }
    }
  );
}
</script>
</body>
</html>
