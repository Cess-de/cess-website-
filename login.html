<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CESS — Login</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</head>

<body>

<div class="form-card">

    <h1>CESS Login</h1>

    <form id="login-form">

        <div class="form-group">
            <label>Email</label>

            <input
                type="email"
                id="email"
                required
                autocomplete="email">
        </div>

        <div class="form-group">
            <label>Password</label>

            <input
                type="password"
                id="password"
                required
                autocomplete="current-password">
        </div>

        <button
            type="submit"
            id="login-button"
            class="btn btn-primary"
            style="width:100%;">
            Login
        </button>

    </form>

    <div
        id="status"
        style="
            margin-top:20px;
            padding:12px;
            display:none;
            border-radius:8px;
            background:#f3f3f3;
        ">
    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

const form = document.getElementById("login-form");
const button = document.getElementById("login-button");
const status = document.getElementById("status");


function showStatus(message) {

    status.style.display = "block";
    status.textContent = message;

}


form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    button.disabled = true;

    button.textContent = "Signing in...";

    showStatus("Signing in...");


    try {

        const result =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        console.log(
            "Firebase login successful:",
            result.user.uid
        );


        showStatus(
            "LOGIN SUCCESS — preparing redirect..."
        );


        /*
         * IMPORTANT:
         * We are deliberately NOT reading Firestore
         * and NOT using auth.js here.
         *
         * This test only checks whether the browser
         * can move from login.html to admin.html.
         */


        setTimeout(function() {

            console.log(
                "REDIRECT TEST → admin.html"
            );

            window.location.href =
                "./admin.html";

        }, 1000);


    } catch (error) {

        console.error(error);

        showStatus(
            error.code +
            " — " +
            error.message
        );

        button.disabled = false;

        button.textContent = "Login";

    }

});

</script>

</body>
</html>
