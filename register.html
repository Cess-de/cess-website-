<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — CESS</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrapper">
    <a href="index.html" class="logo-link">
      <img src="cess-logo.png" alt="CESS logo" onerror="this.style.display='none'">
      <span class="logo-text-mark">
        <span class="primary">CESS</span>
        <span class="secondary" data-en="Civil Engineering Student Society" data-ar="جمعية طلاب الهندسة المدنية">Civil Engineering Student Society</span>
      </span>
    </a>
    <button class="hamburger" id="hamburger" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
    <nav class="nav-menu" id="nav-menu">
      <a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a>
      <a href="about.html" data-en="About" data-ar="عن الجمعية">About</a>
      <a href="activities.html" data-en="Activities" data-ar="الأنشطة">Activities</a>
      <a href="contact.html" data-en="Contact" data-ar="تواصل معنا">Contact</a>
      <div class="nav-actions">
        <button id="lang-toggle" aria-label="Switch language"><span id="lang-toggle-label">AR</span></button>
      </div>
    </nav>
  </div>
</header>

<div class="form-card">
  <h1 class="text-center" data-en="Create Account" data-ar="إنشاء حساب">Create Account</h1>
  <form id="register-form">
    <div class="form-group">
      <label for="fullName" data-en="Full Name" data-ar="الاسم الكامل">Full Name</label>
      <input type="text" id="fullName" required autocomplete="name">
    </div>
    <div class="form-group">
      <label for="email" data-en="Email" data-ar="البريد الإلكتروني">Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="batch" data-en="Batch / Cohort" data-ar="الدفعة">Batch / Cohort</label>
      <input type="text" id="batch" required placeholder="e.g. 2024" data-placeholder-en="e.g. 2024" data-placeholder-ar="مثال: 2024">
    </div>
    <div class="form-group">
      <label for="password" data-en="Password" data-ar="كلمة المرور">Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
    </div>
    <p class="form-error" id="register-error"></p>
    <button type="submit" class="btn btn-primary" style="width:100%;" data-en="Create Account" data-ar="إنشاء حساب">Create Account</button>
  </form>
  <p class="form-footer-link">
    <span data-en="Already have an account?" data-ar="لديك حساب بالفعل؟">Already have an account?</span>
    <a href="login.html" data-en="Login" data-ar="تسجيل الدخول">Login</a>
  </p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script>
  // NOTE: role is never taken from this form — registerUser() in auth.js
  // hard-sets role to "member" on the server-side document. This form has
  // no field for role by design, per spec section 24.
  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("register-error");
    errorEl.classList.remove("visible");

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const batch = document.getElementById("batch").value.trim();
    const password = document.getElementById("password").value;

    try {
      await registerUser({ fullName, email, password, batch });
      redirectToRoleHome(CESS_CONFIG.roles.MEMBER);
    } catch (err) {
      errorEl.textContent = friendlyAuthError(err);
      errorEl.classList.add("visible");
    }
  });
</script>
</body>
</html>
